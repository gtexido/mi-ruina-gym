<style>
:root{--bg:#0d0f14;--surface:#151a24;--card:#1e2330;--card2:#171c26;--accent:#f5a623;--accent2:#e8623a;--green:#2ecc71;--text:#e8ecf4;--muted:#7c869f;--border:#2a3045;--red:#ff5c53;--blue:#5dade2;--purple:#a569bd}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{font-family:'DM Sans',sans-serif;background:radial-gradient(circle at top,#151927 0,#0d0f14 38%,#090b10 100%);color:var(--text);min-height:100vh;padding:env(safe-area-inset-top,0) 0 36px}.app-shell{width:100%;max-width:560px;margin:0 auto;min-height:100vh;border-left:1px solid #ffffff08;border-right:1px solid #ffffff08;background:#0d0f14cc}.header{background:linear-gradient(160deg,#141a26,#0d0f14);padding:22px 16px 14px;text-align:center;border-bottom:1px solid var(--border);position:relative}.header-sub{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:3px}.header h1{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:2px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}.week-badge{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 14px;font-size:12px;color:var(--muted);margin-top:10px}.install-btn-header{position:absolute;right:12px;top:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border:none;border-radius:10px;padding:7px 10px;font-weight:800;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;display:none}.install-btn-header.show{display:block}.config-section{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 12px}.config-row{display:flex;gap:8px;align-items:center}.config-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;min-width:0}.config-input:focus{border-color:var(--accent)}.btn-load{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border:none;border-radius:10px;padding:10px 13px;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif}.btn-load:disabled{opacity:.5}.sync-msg{font-size:11px;text-align:center;padding:7px 0 0;min-height:20px}.sync-msg.ok{color:var(--green)}.sync-msg.err{color:var(--red)}.sync-msg.info{color:var(--muted)}.week-tabs-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:9px 12px;overflow-x:auto;display:flex;gap:7px;scrollbar-width:none}.week-tabs-wrap::-webkit-scrollbar{display:none}.wtab{flex-shrink:0;padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}.wtab.active{border-color:var(--accent);color:var(--accent);background:#241c10}.day-tabs{display:flex;background:var(--surface);padding:10px 12px;gap:8px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}.dtab{flex:1;min-width:0;padding:10px 5px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;cursor:pointer;text-align:center;transition:all .2s}.dtab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border-color:transparent}.dtab-sub{font-family:'DM Sans',sans-serif;font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;display:block;margin-top:2px;opacity:.8;line-height:1.2;white-space:normal}.progress-area{padding:10px 14px 0}.progress-label{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}.progress-bar{height:4px;background:var(--border);border-radius:4px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:4px;transition:width .35s ease}.day-panel{display:none;padding:12px 14px}.day-panel.active{display:block}.section-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin:18px 0 10px;display:flex;align-items:center;gap:10px}.section-title::after{content:'';flex:1;height:1px;background:var(--border)}.section-title:first-child{margin-top:4px}.exercise-card{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden;transition:border-color .2s,background .2s}.exercise-card.completed{border-color:var(--green);background:#142015}.card-top{padding:13px 13px 11px}.card-header{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px}.exercise-name{font-weight:800;font-size:16px;line-height:1.25;flex:1}.check-circle{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;cursor:pointer;flex-shrink:0;background:var(--surface);user-select:none}.exercise-card.completed .check-circle{background:var(--green);border-color:var(--green);color:#000;font-weight:900}.meta-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.badge{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:3px 8px;font-size:12px}.badge.reps{border-color:#3498db44;color:var(--blue)}.badge.rest{border-color:#9b59b644;color:var(--purple)}.badge.rpe{border-color:#e74c3c44;color:#ff736d}.badge.wt{border-color:#f5a62355;color:var(--accent);font-weight:800}.edit-row{display:flex;gap:8px;margin-top:4px}.edit-group{flex:1;min-width:0}.edit-label{font-size:9px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin-bottom:4px}.edit-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 9px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none}.edit-input:focus{border-color:var(--accent)}.edit-input.obs{font-style:italic}.btn-video-row{width:100%;background:#1c0d0d;border:none;border-top:1px solid var(--border);color:#ff655d;padding:10px 13px;font-size:13px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:8px}.btn-video-row.vopen{background:#260f0f}.vtoggle-arrow{margin-left:auto;font-size:10px}.video-wrap{max-height:0;overflow:hidden;transition:max-height .35s ease;background:#000}.video-wrap.vopen{max-height:280px}.video-wrap iframe{width:100%;aspect-ratio:16/9;border:none;display:block}.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}.empty-state .icon{font-size:42px;margin-bottom:10px}.empty-state p{font-size:13px;line-height:1.6}.reset-btn{display:block;margin:15px auto 0;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:7px 16px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--card);border:1px solid var(--green);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;color:var(--green);z-index:9999;transition:transform .3s ease;white-space:nowrap;box-shadow:0 4px 24px #00000066}.toast.show{transform:translateX(-50%) translateY(0)}.toast.err{border-color:var(--red);color:var(--red)}.loading-overlay{display:none;position:fixed;inset:0;background:#0d0f14ee;z-index:500;flex-direction:column;align-items:center;justify-content:center;gap:14px}.loading-overlay.show{display:flex}.loading-spin{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}.loading-text{font-size:13px;color:var(--muted)}@keyframes spin{to{transform:rotate(360deg)}}.spinner{display:inline-block;width:11px;height:11px;border:2px solid #00000033;border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite}.diag{margin:10px 12px 0;padding:9px 10px;border:1px solid #ffffff12;border-radius:10px;color:var(--muted);font-size:11px;display:none}.diag.show{display:block}@media(min-width:720px){body{padding-top:18px}.app-shell{border-radius:24px;overflow:hidden;box-shadow:0 16px 80px #00000055}.header{padding-top:26px}.install-btn-header{right:16px;top:16px}}
</style>
</head>
<body>
<div class="app-shell">
  <div class="loading-overlay" id="loadingOverlay"><div class="loading-spin"></div><div class="loading-text" id="loadingText">Cargando rutina…</div></div>
  <div class="toast" id="toast"></div>
  <div class="header"><div class="header-sub">Plan de entrenamiento</div><h1>MI RUTINA</h1><div class="week-badge" id="weekBadge">–</div><button class="install-btn-header" id="installBtn">📲 Instalar</button></div>
  <div class="config-section"><div class="config-row"><input class="config-input" id="sheetUrl" type="url" placeholder="Link de Google Sheets…" value="https://docs.google.com/spreadsheets/d/1dLY4XouNf4CaoOtxzMFB4ojUO9_XV3pK/edit?usp=drive_link"><button class="btn-load" id="btnLoad" onclick="loadSheet()"><span id="btnLoadTxt">↻ Cargar</span></button></div><div class="sync-msg" id="syncMsg"></div></div>
  <div class="week-tabs-wrap" id="weekTabs"></div><div class="diag" id="diag"></div>
  <div class="day-tabs" id="dayTabs"></div>
  <div class="progress-area"><div class="progress-label"><span>Progreso del día</span><span id="progressText">0 / 0</span></div><div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div></div>
  <div id="panels"></div>
</div>
<script>
const DEFAULT_SID='1dLY4XouNf4CaoOtxzMFB4ojUO9_XV3pK';
const EXPECTED_SHEETS=[...Array.from({length:30},(_,i)=>`Semana ${i+1}`),'Entrenamiento en casa'];
let allWeeks={}, weekNames=[], activeWeek=0, activeDay=0, openVideos={};
let completed=JSON.parse(localStorage.getItem('gt_completed_v2')||'{}');
let userEdits=JSON.parse(localStorage.getItem('gt_edits_v2')||'{}');
let diagnostics=[];
function norm(s){return String(s??'').replace(/\u00a0/g,' ').trim()}
function low(s){return norm(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function esc(s){return norm(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function sheetId(url){const m=String(url||'').match(/\/d\/([a-zA-Z0-9_-]+)/);return m?m[1]:DEFAULT_SID}
function weekNum(n){const m=norm(n).match(/semana\s*(\d+)/i);return m?parseInt(m[1],10):null}
function key(di,ei){return `${weekNames[activeWeek]||'S0'}_${di}_${ei}`}
function isBlankRow(r){return !r || r.every(c=>!norm(c))}
function isDay(c){return /^d[ií]a\s*\d+/i.test(norm(c))}
function dayLabel(c){const m=norm(c).match(/\d+/);return m?`DÍA ${m[0]}`:norm(c)}
function isHeader(c){const t=low(c);return t==='ejercicio'||t.includes('video explicativo')||t.includes('series y reps')||t.includes('descanso')||t.includes('rpe')||t==='peso'||t.includes('observaciones')}
function isSectionTitle(c){const t=low(c);return t.includes('entrada en calor')||t.includes('zona media')||/^entrenamiento(\s*\(|\s*$)/i.test(norm(c))}
function sectionName(c){const raw=norm(c);const t=low(raw);if(t.includes('entrada en calor'))return 'Entrada en calor';if(t.includes('zona media'))return 'Zona media';if(t.startsWith('entrenamiento'))return 'Entrenamiento';return raw}
function focusFrom(c){const m=norm(c).match(/\(([^)]+)\)/);return m?m[1].replace(/-/g,' - ').replace(/\s+/g,' ').trim():''}
function getVid(url){const m=String(url||'').match(/(?:shorts\/|v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null}
function parseCSV(csv){const rows=[];let row=[],cur='',q=false;for(let i=0;i<csv.length;i++){const ch=csv[i],nx=csv[i+1];if(ch==='"'){if(q&&nx==='"'){cur+='"';i++}else q=!q}else if(ch===','&&!q){row.push(cur);cur=''}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&nx==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}row.push(cur);rows.push(row);return rows.map(r=>r.map(norm))}
async function fetchCSV(sid,sheet){const url=`https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}&cb=${Date.now()}`;const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const text=await res.text();if(!text||text.trim().startsWith('<'))throw new Error('sin acceso o hoja inexistente');return text}
function ensureDay(days,sheetName){if(days.length===0){days.push({label:sheetName.toLowerCase().includes('casa')?'CASA':'DÍA 1',focus:sheetName.toLowerCase().includes('casa')?'Entrenamiento en casa':'',sections:[]})}return days[days.length-1]}
function ensureSection(day,name){let sec={title:name,exercises:[]};day.sections.push(sec);return sec}
function parseRows(rows,sheetName){let days=[],curDay=null,curSec=null,lastHeader=[];for(let i=0;i<rows.length;i++){const r=rows[i]||[];if(isBlankRow(r))continue;let c0=norm(r[0]);if(!c0)continue;if(isDay(c0)){curDay={label:dayLabel(c0),focus:'',sections:[]};days.push(curDay);curSec=null;lastHeader=[];continue}if(sheetName.toLowerCase().includes('casa') && low(c0)==='entrenamiento en casa'){curDay={label:'CASA',focus:'Entrenamiento en casa',sections:[]};days.push(curDay);curSec=null;continue}if(isSectionTitle(c0)){curDay=curDay||ensureDay(days,sheetName);curSec=ensureSection(curDay,sectionName(c0));const f=focusFrom(c0);if(f)curDay.focus=f;lastHeader=[];continue}if(isHeader(c0)){lastHeader=r.map(low);continue}if(!curDay)curDay=ensureDay(days,sheetName);if(!curSec)curSec=ensureSection(curDay,'Entrenamiento');if(isHeader(c0)||isSectionTitle(c0)||isDay(c0))continue;const name=c0;const video=norm(r[1]);const reps=norm(r[2]);const rest=norm(r[3]);const rpe=norm(r[4]);let weight='',obs='';const h5=lastHeader[5]||'',h6=lastHeader[6]||'';if(h5.includes('peso')){weight=norm(r[5]);obs=norm(r[6])}else{obs=norm(r[5]||r[6])}if(name && (video||reps||rest||rpe||weight||obs)){curSec.exercises.push({name,video:video.startsWith('http')?video:'',reps,rest,rpe,weight,obs,rowIdx:i})}}
  days=days.map(d=>({...d,sections:d.sections.map(s=>({...s,exercises:s.exercises.filter(e=>e.name&&!isHeader(e.name))})).filter(s=>s.exercises.length)})).filter(d=>d.sections.length);
  days.forEach(d=>{if(!d.focus){const tr=d.sections.find(s=>low(s.title).includes('entrenamiento')); if(tr) d.focus=d.label==='CASA'?'Casa':''}});
  return {days};}
function validParsed(p){return p&&p.days&&p.days.some(d=>d.sections.some(s=>s.exercises.length))}
function sortSheets(names){return names.sort((a,b)=>{const an=weekNum(a),bn=weekNum(b);if(an&&bn)return an-bn;if(an&&!bn)return -1;if(!an&&bn)return 1;return a.localeCompare(b,'es')})}
async function loadSheet(){const raw=document.getElementById('sheetUrl').value.trim();const sid=sheetId(raw);setBtn(true);msg('Conectando con Google Sheets…','info');showLoading('Leyendo solapas reales…');diagnostics=[];allWeeks={};weekNames=[];try{for(const sh of EXPECTED_SHEETS){try{const csv=await fetchCSV(sid,sh);const rows=parseCSV(csv);const parsed=parseRows(rows,sh);if(validParsed(parsed)){allWeeks[sh]=parsed;weekNames.push(sh);let count=parsed.days.reduce((a,d)=>a+d.sections.reduce((b,s)=>b+s.exercises.length,0),0);diagnostics.push(`✓ ${sh}: ${parsed.days.length} día(s), ${count} ejercicio(s)`)}}catch(e){}}
    weekNames=sortSheets([...new Set(weekNames)]);if(!weekNames.length)throw new Error('No encontré solapas válidas. Revisá que el archivo esté compartido como público o “cualquier persona con link”.');
    localStorage.setItem('gt_sheetUrl',raw);const numeric=weekNames.map((n,i)=>({n,i,num:weekNum(n)})).filter(x=>x.num);activeWeek=numeric.length?numeric[numeric.length-1].i:weekNames.length-1;activeDay=0;openVideos={};render();msg(`✓ ${weekNames.length} solapa(s) — mostrando ${weekNames[activeWeek]}`,'ok');toast(`✓ ${weekNames[activeWeek]} cargada`)}catch(e){msg('⚠ '+e.message,'err');toast(e.message,true);renderEmpty()}finally{setBtn(false);hideLoading();}}
function render(){renderWeeks();renderDays();renderPanels();updateWeekBadge();scrollWeekTabToActive();renderDiag()}
function renderWeeks(){document.getElementById('weekTabs').innerHTML=weekNames.map((n,i)=>`<button class="wtab${i===activeWeek?' active':''}" onclick="switchWeek(${i})">${esc(n)}</button>`).join('')}
function renderDays(){const data=allWeeks[weekNames[activeWeek]];const days=data?.days||[];document.getElementById('dayTabs').innerHTML=days.map((d,i)=>`<button class="dtab${i===activeDay?' active':''}" onclick="switchDay(${i})">${esc(d.label)}<span class="dtab-sub">${esc(d.focus||'–')}</span></button>`).join('')}
function renderPanels(){const data=allWeeks[weekNames[activeWeek]];const days=data?.days||[];document.getElementById('panels').innerHTML=days.map((d,di)=>`<div id="panel${di}" class="day-panel${di===activeDay?' active':''}">${renderDay(d,di)}</div>`).join('');updateProgress()}
function renderDay(day,di){let html='',ei=0;day.sections.forEach(sec=>{html+=`<div class="section-title">${esc(sec.title)}</div>`;sec.exercises.forEach(ex=>{html+=renderExercise(ex,di,ei);ei++})});html+=`<button class="reset-btn" onclick="resetDay(${di})">↺ Reiniciar día</button>`;return html}
function renderExercise(ex,di,ei){const k=key(di,ei),done=!!completed[k],edit=userEdits[k]||{},wt=edit.weight!==undefined?edit.weight:ex.weight,ob=edit.obs!==undefined?edit.obs:ex.obs,vid=getVid(ex.video),vk=`${di}_${ei}`;return `<div class="exercise-card${done?' completed':''}" id="card_${k}"><div class="card-top"><div class="card-header"><div class="exercise-name">${esc(ex.name)}</div><div class="check-circle" onclick="toggleDone('${k}')">${done?'✓':'○'}</div></div><div class="meta-row">${ex.reps?`<span class="badge reps">🔁 ${esc(ex.reps)}</span>`:''}${ex.rest?`<span class="badge rest">⏱ ${esc(ex.rest)}</span>`:''}${ex.rpe?`<span class="badge rpe">RPE ${esc(ex.rpe)}</span>`:''}${wt?`<span class="badge wt">🏋️ ${esc(wt)}</span>`:''}</div><div class="edit-row"><div class="edit-group"><div class="edit-label">🏋️ Peso</div><input class="edit-input" value="${esc(wt)}" placeholder="ej. 20 kg" oninput="saveEdit('${k}','weight',this.value)"></div><div class="edit-group"><div class="edit-label">📌 Observaciones</div><input class="edit-input obs" value="${esc(ob)}" placeholder="Notas…" oninput="saveEdit('${k}','obs',this.value)"></div></div></div>${vid?`<button class="btn-video-row${openVideos[vk]?' vopen':''}" id="vbtn_${vk}" onclick="toggleVideo('${vk}','${vid}')"><span>▶</span><span>Ver video del ejercicio</span><span class="vtoggle-arrow">${openVideos[vk]?'▲':'▼'}</span></button><div class="video-wrap${openVideos[vk]?' vopen':''}" id="vwrap_${vk}">${openVideos[vk]?`<iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen loading="lazy"></iframe>`:''}</div>`:''}</div>`}
function switchWeek(i){activeWeek=i;activeDay=0;openVideos={};render()}
function switchDay(i){activeDay=i;document.querySelectorAll('.day-panel').forEach((p,j)=>p.classList.toggle('active',j===i));document.querySelectorAll('.dtab').forEach((t,j)=>t.classList.toggle('active',j===i));updateProgress()}
function toggleDone(k){completed[k]=!completed[k];localStorage.setItem('gt_completed_v2',JSON.stringify(completed));const card=document.getElementById('card_'+k);if(card){card.classList.toggle('completed',completed[k]);card.querySelector('.check-circle').textContent=completed[k]?'✓':'○'}updateProgress()}
function saveEdit(k,f,v){if(!userEdits[k])userEdits[k]={};userEdits[k][f]=v;localStorage.setItem('gt_edits_v2',JSON.stringify(userEdits))}
function resetDay(di){if(!confirm('¿Reiniciar progreso de este día?'))return;const data=allWeeks[weekNames[activeWeek]],day=data.days[di];let ei=0;day.sections.forEach(s=>s.exercises.forEach(()=>{delete completed[key(di,ei)];ei++}));localStorage.setItem('gt_completed_v2',JSON.stringify(completed));renderPanels()}
function toggleVideo(vk,vid){openVideos[vk]=!openVideos[vk];const w=document.getElementById('vwrap_'+vk),b=document.getElementById('vbtn_'+vk);if(!w||!b)return;if(openVideos[vk]){w.innerHTML=`<iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen loading="lazy"></iframe>`;w.classList.add('vopen');b.classList.add('vopen');b.querySelector('.vtoggle-arrow').textContent='▲'}else{w.innerHTML='';w.classList.remove('vopen');b.classList.remove('vopen');b.querySelector('.vtoggle-arrow').textContent='▼'}}
function updateProgress(){const data=allWeeks[weekNames[activeWeek]],day=data?.days?.[activeDay];let total=0,done=0;if(day){let ei=0;day.sections.forEach(s=>s.exercises.forEach(()=>{total++;if(completed[key(activeDay,ei)])done++;ei++}))}document.getElementById('progressText').textContent=`${done} / ${total}`;document.getElementById('progressFill').style.width=total?`${done/total*100}%`:'0%'}
function updateWeekBadge(){document.getElementById('weekBadge').textContent=weekNames[activeWeek]||'–'}
function scrollWeekTabToActive(){const a=document.querySelector('.wtab.active');if(a)a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
function renderEmpty(){weekNames=[];allWeeks={};document.getElementById('weekTabs').innerHTML='';document.getElementById('dayTabs').innerHTML='';document.getElementById('panels').innerHTML='<div class="empty-state"><div class="icon">⚠️</div><p>No se pudieron cargar ejercicios.</p></div>';updateWeekBadge();updateProgress();renderDiag(true)}
function renderDiag(force=false){const d=document.getElementById('diag');d.innerHTML=diagnostics.slice(-12).map(x=>`<div>${esc(x)}</div>`).join('');d.classList.toggle('show',force)}
function setBtn(on){document.getElementById('btnLoad').disabled=on;document.getElementById('btnLoadTxt').innerHTML=on?'<span class="spinner"></span>':'↻ Cargar'}
function msg(m,t){const e=document.getElementById('syncMsg');e.textContent=m;e.className='sync-msg '+(t||'')}
function showLoading(t){document.getElementById('loadingText').textContent=t;document.getElementById('loadingOverlay').classList.add('show')}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('show')}
function toast(m,err=false){const t=document.getElementById('toast');t.textContent=m;t.className='toast '+(err?'err ':'')+'show';setTimeout(()=>t.classList.remove('show'),3000)}
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').classList.add('show')});document.getElementById('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').classList.remove('show')};if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
(function init(){const saved=localStorage.getItem('gt_sheetUrl');if(saved)document.getElementById('sheetUrl').value=saved;loadSheet()})();
</script>
